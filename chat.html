<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

<!--    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>-->
</head>
<body>

    <div class="container mt-4">
        <h1 class="text-center">Real-Time Chat Application</h1>

        <div id="chat" class="border rounded p-3 mb-3" style="height: 300px; overflow-y:auto;"></div>
        <div class="input-group mb-3">
            <input id="senderInput" type="text" class="form-control" placeholder="Enter your name..."/>
        </div>

        <div class="input-group mb-3">
            <input id="messageInput" type="text" class="form-control" placeholder="Type a message..."/>
            <div id="input-group-append">
                <button id="sendMessage" type="button" class="btn btn-success">Send</button>
            </div>
        </div>
    </div>
</body>
<script>

    let client = null;

    function setConnected(connected){
        document.getElementById('sendMessage').disabled = !connected;
    }

    function connect() {
    client = new StompJs.Client({
      webSocketFactory: () => new SockJS('/chat'),
      debug: (str) => console.log(str),
      onConnect: (frame) => {
        setConnected(true);
        client.subscribe('/topic/messages', (message) => {
          showMessage(JSON.parse(message.body));
        });
      },
      onStompError: (frame) => {
        console.error('Broker error: ' + frame.headers['message']);
        console.error('Details: ' + frame.body);
      }
    });

    client.activate();
  }


    function showMessage(message){
         var chat = document.getElementById('chat');
         var messageElement = document.createElement('div');
         messageElement.textContent = (message.sender || "Unknown") + ': ' +(message.content || JSON.stringify(message));
         messageElement.class ="border-bottom mb-1";
         chat.appendChild(messageElement);
         chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage(){
         var sender = document.getElementById('senderInput').value;
         var content = document.getElementById('messageInput').value;
         var chatMessage = {
            sender : sender,
            content : content
         }
            //the data now we are sending on server
          client.publish({ destination: "/app/sendMessage", body: JSON.stringify(chatMessage) });

            //this line we write to clear the text area of the msg
         document.getElementById('messageInput').value = '';
    }

    document.getElementById('sendMessage').onclick = sendMessage;
    window.onload = connect;
</script>
</html>
